# spring config
spring:
  application:
    name: easywork # App name
  jackson:
    time-zone: Asia/Seoul

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:easywork}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:0000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:1000ms}

    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:test}

  jpa:
    open-in-view: false # Lazy Loading 버그 예방
    properties.hibernate.logging.level:
      org.hibernate.SQL: debug
      org.hibernate.type.descriptor.sql: trace

#Java Web Token
jwt:
  secret: ${JWT_SECRET:my-secret-key-my-secret-key-my-secret-key-123456}
  access-token-validity: ${AT_VALID:3600000}
  refresh-token-validity: ${RT_VALID:25200000}

# server
server:
  address: 0.0.0.0
  port: 8080
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true